<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parenting & Child Growth Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <h1 class="text-center mb-4">👶 Online Parenting & Child Growth Tracker</h1>

  <div class="card p-3 mb-4 shadow-sm">
    <h4>Add Child Growth Record</h4>
    <form id="childForm">
      <div class="mb-3">
        <label class="form-label">Child Name</label>
        <input type="text" id="name" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Age (Years)</label>
        <input type="number" id="age" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Height (cm)</label>
        <input type="number" id="height" class="form-control" required>
      </div>
      <button class="btn btn-primary">Add Record</button>
    </form>
  </div>

  <h4>All Child Growth Records</h4>
  <div id="childList" class="row g-3"></div>
</div>

<script src="script.js"></script>
</body>
</html>
